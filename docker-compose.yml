services:
  mysql:
    image: mysql:8.4
    container_name: pmt-mysql
    environment:
      MYSQL_DATABASE: pmt
      MYSQL_USER: pmt
      MYSQL_PASSWORD: pmt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${PMT_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upmt", "-ppmt"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: pmt-mailpit
    ports:
      - "${PMT_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${PMT_MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
    container_name: pmt-backend
    environment:
      PMT_DATABASE_URL: jdbc:mysql://mysql:3306/pmt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PMT_DATABASE_USERNAME: pmt
      PMT_DATABASE_PASSWORD: pmt
      PMT_MAIL_HOST: mailpit
      PMT_MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-at-least-32-chars}
      PMT_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "${PMT_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: pmt-frontend
    ports:
      - "${PMT_FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
