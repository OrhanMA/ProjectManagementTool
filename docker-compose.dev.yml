services:
  mysql:
    image: mysql:8.4
    container_name: pmt-dev-mysql
    environment:
      MYSQL_DATABASE: pmt
      MYSQL_USER: pmt
      MYSQL_PASSWORD: pmt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${PMT_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: pmt-dev-mailpit
    ports:
      - "${PMT_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${PMT_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-dev-data:
