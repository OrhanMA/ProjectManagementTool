spring:
  application:
    name: pmt
  datasource:
    url: ${PMT_DATABASE_URL:jdbc:mysql://localhost:3306/pmt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PMT_DATABASE_USERNAME:pmt}
    password: ${PMT_DATABASE_PASSWORD:pmt}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${PMT_MAIL_HOST:localhost}
    port: ${PMT_MAIL_PORT:1025}

server:
  port: ${PORT:8080}

pmt:
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-development-secret-at-least-32-chars}
    access-token-minutes: ${PMT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${PMT_REFRESH_TOKEN_DAYS:14}
  cors:
    allowed-origins: ${PMT_CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
